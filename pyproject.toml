[project]
name = "cbc-scanner"
version = "0.1.0"
description = "Raspberry Pi based multispectral CBC image acquisition system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "rich>=13.7.1",
    "typer>=0.11.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "pyserial>=3.5",
]

[project.scripts]
cbc-ui = "cbc_scanner.cli.app:run_ui"
cbc-test-camera = "cbc_scanner.cli.test_camera:main"
cbc-capture = "cbc_scanner.cli.capture:main"
cbc-demo-scan = "cbc_scanner.cli.scan_demo:main"
cbc-storage-info = "cbc_scanner.cli.storage_info:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
